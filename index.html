olid #465a46;border-radius:12px;background:#121a14;color:white;padding:12px;outline-color:#a8d532}input[type=file]{padding:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{width:72px;height:72px;object-fit:cover;border-radius:12px}.entry{display:flex;gap:12px;align-items:center}.entry .details{flex:1}.pill{background:#344a2e;color:#c8ed8a;border-radius:99px;padding:4px 9px;font-size:11px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.empty{padding:26px;text-align:center;color:#acb7a9}.small{font-size:12px}a{color:#a8d532}

main{padding:18px 16px 115px}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 12%,#46613a 0,transparent 42%),linear-gradient(140deg,#2c402b,#18251d);border:1px solid #40543c;padding:25px 22px;box-shadow:0 14px 40px #0003}.hero:after{content:'🎣';position:absolute;right:-10px;bottom:-34px;font-size:112px;opacity:.08;transform:rotate(-18deg);pointer-events:none}.hero h1{font-size:clamp(27px,6vw,40px);letter-spacing:-.8px}.hero p{line-height:1.5}.stats{gap:8px}.stat{border:1px solid #314032;padding:14px 5px}.stat strong{font-size:clamp(16px,4.2vw,24px);letter-spacing:-.5px}.stat small{display:block;font-size:11px;margin-top:6px}.card{box-shadow:0 6px 20px #0002}.catch-card{padding:12px;align-items:center;gap:9px}.catch-card .entry{min-width:0;flex:1}.catch-card .details{min-width:0}.catch-card .details strong{font-size:15px}.catch-card .details small{display:block;line-height:1.4;font-size:11px;margin-top:5px}.catch-card .weight{font-size:17px;text-align:right}.catch-card .btn{font-size:11px;padding:7px 11px;margin-top:8px;float:right}.photo,.photo-placeholder{width:76px;height:76px;flex:0 0 76px;object-fit:cover;border-radius:13px}.photo-placeholder{display:grid;place-items:center;background:linear-gradient(135deg,#3c523b,#263729);border:1px solid #50644c;font-size:30px;color:#a8d532}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title small{color:#a8d532;font-weight:700}nav{padding:7px 8px max(10px,env(safe-area-inset-bottom));background:#172019ee;backdrop-filter:blur(18px);box-shadow:0 -6px 22px #0004;gap:2px}nav button{flex:1;min-width:0;max-width:96px;padding:8px 3px;font-size:11px;line-height:1.3}nav button .nav-icon{display:block;font-size:21px;height:25px;line-height:23px;margin-bottom:3px}nav button.plus{flex:0 0 62px;max-width:62px;height:58px;align-self:center;border-radius:19px;padding:5px 2px;font-size:11px;box-shadow:0 5px 20px #a8d53230}nav button.plus .nav-icon{font-size:28px;font-weight:900;height:31px;line-height:29px;margin:0}.lb-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:12px 0}.lb-tabs button{border:1px solid #415441;background:#273629;color:#c5d3be;border-radius:10px;padding:10px 4px;font-size:11px;font-weight:700}.lb-tabs button.selected{background:#a8d532;color:#152011;border-color:#a8d532}.leader-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#26372a;padding:14px;border-radius:13px;border:1px solid #425b3c}.leader-row strong{font-size:15px}.leader-row .weight{font-size:17px}.leader-caption{font-size:12px;line-height:1.5;margin:12px 0}.card h2{margin-top:13px}.btn{transition:transform .15s}.btn:active{transform:scale(.97)}@media(min-width:600px){nav{max-width:740px;left:50%;transform:translateX(-50%);border-left:1px solid #344333;border-right:1px solid #344333}}
nav button{font-size:10px}nav button.plus{flex-basis:54px;max-width:54px}.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tool-tile{background:#26372a;border:1px solid #3d513b;border-radius:15px;padding:15px 12px}.tool-tile small{display:block;color:#aab7a4;margin-bottom:8px;font-size:12px}.tool-tile strong{font-size:21px;color:#eaf5e5}.tool-tile .hint{display:block;font-size:11px;color:#a8d532;margin-top:6px}.weather-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.weather-title h2{margin:0}.tool-note{font-size:12px;line-height:1.5}.forecast-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #344333;font-size:13px}.forecast-row:last-child{border:0}.check-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #344333}.check-row input{width:20px;height:20px;accent-color:#a8d532}.check-row span.done{text-decoration:line-through;color:#84917f}.timer{font-size:28px;font-weight:900;color:#a8d532;letter-spacing:1px}.location-row{display:flex;gap:8px;align-items:end}.location-row input{min-width:0}.location-row .btn{white-space:nowrap}.weather-status{color:#a8d532;font-size:12px;margin-top:9px}
</style></head><body><header><div class="brand">🎣 FRESH <b>FISHING</b><div class="tag">TRACKER • PROTOTYPE</div></div><span class="mode">● LOCAL MODE</span></header><div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const sample={name:'My Angler Profile',catches:[{id:1,species:'Mirror Carp',lb:22,oz:0,venue:'Clearwater',date:new Date().toISOString().slice(0,10),notes:'Great fight!',social:'Clearwater Social'},{id:2,species:'Common Carp',lb:16,oz:8,venue:'Clearwater',date:new Date().toISOString().slice(0,10),social:'Clearwater Social'}],socials:[{id:1,name:'Clearwater Social',venue:'Clearwater',date:new Date().toISOString().slice(0,10)}]};
let data;try{data=JSON.parse(localStorage.getItem('fft-proto'))||sample}catch{data=sample}
let page='Home',edit=null,filter='All',expanded=null,leaderMetric='total';
let weather=null,weatherError='',weatherBusy=false,weatherPlace='',weatherLat=null,weatherLon=null;

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wt=o=>Math.floor(o/16)+'lb '+(o%16)+'oz',oz=c=>Number(c.lb||0)*16+Number(c.oz||0),total=a=>a.reduce((s,c)=>s+oz(c),0);
const pb=()=>Math.max(0,...data.catches.map(oz));
function save(){try{localStorage.setItem('fft-proto',JSON.stringify(data))}catch{alert('Storage is full. Try a smaller catch photo.')}render()}
function go(p){page=p;render()}
function newCatch(social=''){edit={id:null,species:'Mirror Carp',lb:'',oz:0,venue:'',date:new Date().toISOString().slice(0,10),notes:'',bait:'',rig:'',peg:'',photo:'',social};go('Log')}
function cards(arr){return arr.length?arr.map(c=>'<div class="card item catch-card"><div class="entry">'+(c.photo?'<img class="photo" alt="Catch photo" src="'+c.photo+'">':'<div class="photo-placeholder" aria-label="No catch photo">♧</div>')+'<div class="details"><strong>'+safe(c.species)+'</strong><small>'+safe([c.venue,c.date,c.social].filter(Boolean).join(' • '))+'</small></div></div><div><div class="weight">'+wt(oz(c))+'</div><button class="btn secondary small" data-edit="'+c.id+'">Edit</button></div></div>').join(''):'<div class="card empty">No catches yet. Tap + to log one!</div>'}
function input(label,key,type='text'){return '<div><label>'+label+'</label><input data-field="'+key+'" type="'+type+'" '+(type==='number'?'min="0" ':'')+'value="'+safe(edit[key])+'"></div>'}
function select(label,key,values){return '<div><label>'+label+'</label><select data-field="'+key+'">'+values.map(v=>'<option value="'+safe(v)+'" '+(edit[key]===v?'selected':'')+'>'+safe(v||'Personal catch')+'</option>').join('')+'</select></div>'}

const formatHour=t=>String(t||'').slice(11,16);
const fmtPressure=n=>Number.isFinite(n)?Math.round(n)+' hPa':'—';
async function loadWeather(lat,lon,label){weatherBusy=true;weatherError='';weather=null;weatherPlace=label;weatherLat=lat;weatherLon=lon;render();try{
const url='https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+'&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m,surface_pressure&hourly=surface_pressure,precipitation_probability,temperature_2m,wind_speed_10m&daily=sunrise,sunset&forecast_days=2&timezone=auto&wind_speed_unit=mph';
const res=await fetch(url);if(!res.ok)throw Error('weather service returned '+res.status);weather=await res.json();if(!weather.current||!weather.hourly)throw Error('incomplete weather data');localStorage.setItem('fft-weather-location',JSON.stringify({lat,lon,label}));}catch(err){weatherError='Weather request failed: '+(err.message||'check your connection')+'. You can retry or open the forecast below.'}finally{weatherBusy=false;render()}}
async function searchWeather(place){place=(place||'').trim();if(!place)return;weatherBusy=true;weatherError='';weatherPlace=place;render();try{let query=place.split(',')[0].trim();let res=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=10&language=en&format=json');if(!res.ok)throw Error('Location lookup failed');let json=await res.json(),places=json.results||[];let uk=places.find(x=>x.country_code==='GB'),loc=uk||places[0];if(!loc)throw Error('Location not found. Try the nearest town or postcode area.');await loadWeather(loc.latitude,loc.longitude,[loc.name,loc.admin1,loc.country].filter(Boolean).join(', '));}catch(err){weatherBusy=false;weatherError=(err.message||'Could not find that location')+'. Try Use my location or the direct forecast link below.';render()}}
function direction(deg){return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8]}
function toolsScreen(){let c=weather?.current,h=weather?.hourly,d=weather?.daily;let trend='—';if(c&&h){let idx=h.time.findIndex(t=>t.slice(0,13)>=c.time.slice(0,13));if(idx<0)idx=0;let later=h.surface_pressure[Math.min(idx+3,h.surface_pressure.length-1)],now=h.surface_pressure[idx];trend=later>now+1?'Rising ↗':later<now-1?'Falling ↘':'Steady →'}
return '<h1>Fishing Tools</h1><p>Plan your session and keep an eye on conditions at the lake.</p><div class="card"><div class="weather-title"><h2>🌤 Fishing conditions</h2><span class="pill">LIVE WEATHER</span></div><p class="tool-note">'+safe(weatherPlace||'Choose a lake or use your location')+'</p><div class="location-row"><div style="flex:1"><label>Lake / nearest town</label><input id="weather-search" placeholder="e.g. Stafford, UK" value="'+safe(weatherPlace||'')+'"></div><button class="btn" data-weather-search>Search</button></div><div class="actions" style="margin-top:10px"><button class="btn secondary" data-weather-here>📍 Use my location</button>'+(weatherLat!==null?'<button class="btn secondary" data-weather-refresh>Refresh</button>':'')+'</div>'+(weatherBusy?'<p class="weather-status">Loading weather…</p>':'')+(weatherError?'<p style="color:#ffb3a9">'+safe(weatherError)+'</p>':'')+(c?'<div class="tool-grid" style="margin-top:17px"><div class="tool-tile"><small>🌡 Temperature</small><strong>'+Math.round(c.temperature_2m)+'°C</strong></div><div class="tool-tile"><small>◉ Air pressure</small><strong>'+fmtPressure(c.surface_pressure)+'</strong><span class="hint">'+trend+' (next 3h)</span></div><div class="tool-tile"><small>💨 Wind</small><strong>'+Math.round(c.wind_speed_10m)+' mph</strong><span class="hint">'+direction(c.wind_direction_10m)+'</span></div><div class="tool-tile"><small>☔ Rain now</small><strong>'+c.precipitation+' mm</strong><span class="hint">Humidity '+c.relative_humidity_2m+'%</span></div></div><h3>Next few hours</h3>'+(h? h.time.map((t,i)=>({t,i})).filter(x=>x.t.slice(0,13)>=c.time.slice(0,13)).slice(0,5).map(x=>'<div class="forecast-row"><span>'+formatHour(x.t)+'</span><span>'+Math.round(h.temperature_2m[x.i])+'°C</span><span>'+Math.round(h.precipitation_probability[x.i]||0)+'% rain</span><span>'+fmtPressure(h.surface_pressure[x.i])+'</span></div>').join(''):'')+(d?'<p class="tool-note">🌅 Sunrise '+formatHour(d.sunrise[0])+' · 🌇 Sunset '+formatHour(d.sunset[0])+'</p>':'')+'<p class="tool-note">Forecast data: Open-Meteo. Pressure is surface pressure, not sea-level pressure. Weather patterns are not reliable bite predictions.</p>':'<p class="tool-note">See temperature, wind, rain, pressure trends and sunrise/sunset for your fishing location.</p>')+'<p class="tool-note"><a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Weather data source</a> · <a href="https://www.metoffice.gov.uk/weather/forecast" target="_blank" rel="noopener">Check Met Office forecast</a></p>'+'</div>'}
function render(){let body='';
if(page==='Home')body='<div class="hero"><div class="tag">YOUR FISHING HUB</div><h1>Every catch counts.</h1><p>Your sessions, catches and fishing socials in one place.</p><button class="btn" data-new>+ Log a catch</button></div><div class="stats"><div class="stat"><strong>'+data.catches.length+'</strong><small>Catches</small></div><div class="stat"><strong>'+wt(pb())+'</strong><small>Personal best</small></div><div class="stat"><strong>'+data.socials.length+'</strong><small>Socials</small></div></div><div class="section-title"><h2>Recent catches</h2><small>YOUR LATEST FISH</small></div>'+cards(data.catches.slice(0,3))+'<div class="actions"><button class="btn secondary" data-go="Diary">My fishing diary</button><button class="btn secondary" data-go="Socials">View socials</button></div>';
if(page==='Diary')body='<h1>My Fishing</h1><p>Your personal catch diary. Private on this device.</p><div class="actions"><button class="btn" data-new>+ Add catch</button><button class="btn secondary" data-filter>'+filter+'</button></div>'+cards(data.catches.filter(c=>filter==='All'||!c.social))+'<div class="card"><h2>Your stats</h2><p>Total weight: '+wt(total(data.catches))+'</p><p>Biggest fish: '+wt(pb())+'</p></div>';
if(page==='Log'){if(!edit)newCatch();body='<h1>'+(edit.id?'Edit catch':'Log a catch')+'</h1><p>Record your latest fish.</p><div class="card">'+select('Species','species',['Mirror Carp','Common Carp','Leather Carp','Grass Carp','Other'])+'<div class="two">'+input('Pounds (lb)','lb','number')+input('Ounces (oz)','oz','number')+'</div>'+input('Venue','venue')+input('Date','date','date')+select('Social (optional)','social',['',...data.socials.map(s=>s.name)])+'<div class="two">'+input('Bait','bait')+input('Peg / swim','peg')+'</div>'+input('Rig','rig')+'<label>Notes</label><textarea data-field="notes">'+safe(edit.notes)+'</textarea><label>Catch photo (small images recommended)</label><input id="photo-input" type="file" accept="image/*">'+(edit.photo?'<img class="photo" style="margin-top:12px" src="'+edit.photo+'">':'')+'<div class="actions" style="margin-top:20px"><button class="btn" data-save>Save catch</button><button class="btn secondary" data-go="Diary">Cancel</button>'+(edit.id?'<button class="btn danger" data-delete>Delete</button>':'')+'</div></div>'}
if(page==='Socials')body='<h1>Fishing Socials</h1><p>Individual anglers. Every fish counts.</p><button class="btn" data-create>+ Create social</button>'+data.socials.map(s=>{const fish=data.catches.filter(c=>c.social===s.name),big=Math.max(0,...fish.map(oz)),value=leaderMetric==='total'?wt(total(fish)):leaderMetric==='biggest'?wt(big):String(fish.length)+' fish';return '<div class="card"><span class="pill">SOCIAL</span><h2>'+safe(s.name)+'</h2><p>'+safe(s.venue)+' • '+safe(s.date)+'</p><div class="stats"><div class="stat"><strong>'+fish.length+'</strong><small>Catches</small></div><div class="stat"><strong>'+wt(total(fish))+'</strong><small>Total weight</small></div><div class="stat"><strong>'+wt(big)+'</strong><small>Biggest</small></div></div><h3>Individual leaderboard</h3><div class="lb-tabs"><button data-metric="biggest" class="'+(leaderMetric==='biggest'?'selected':'')+'">Biggest fish</button><button data-metric="total" class="'+(leaderMetric==='total'?'selected':'')+'">Total weight</button><button data-metric="count" class="'+(leaderMetric==='count'?'selected':'')+'">Most catches</button></div><div class="leader-row"><strong>🥇 '+safe(data.name||'You')+'</strong><span class="weight">'+value+'</span></div><p class="leader-caption">This is your local result. Live rankings with other anglers will be available when shared accounts are connected.</p><div class="actions"><button class="btn" data-social="'+safe(s.name)+'">+ Log social catch</button><button class="btn secondary" data-expand="'+s.id+'">'+(expanded===s.id?'Hide catches':'View catches')+'</button></div>'+(expanded===s.id?cards(fish):'')+'</div>'}).join('');
if(page==='Tools')body=toolsScreen();
if(page==='Profile')body='<h1>Angler Profile</h1><div class="card"><label>Display name</label><input id="profile-name" value="'+safe(data.name)+'"><div class="stats"><div class="stat"><strong>'+data.catches.length+'</strong><small>Catches</small></div><div class="stat"><strong>'+wt(pb())+'</strong><small>PB</small></div><div class="stat"><strong>'+data.socials.length+'</strong><small>Socials</small></div></div></div><div class="card"><h2>Prototype mode</h2><p>Data is saved locally in this browser. Shared accounts and live leaderboards are coming later.</p><button class="btn secondary" data-export>Export my data</button></div>';
$('#root').innerHTML='<main>'+body+'</main><nav>'+[['Home','⌂'],['Diary','▤'],['Log','+'],['Socials','🏆'],['Tools','☁'],['Profile','♙']].map(([p,i])=>'<button class="'+(p===page?'active ':'')+(p==='Log'?'plus':'')+'" data-nav="'+p+'"><span class="nav-icon">'+i+'</span>'+(p==='Log'?'Log':p)+'</button>').join('')+'</nav>'}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav) d.nav==='Log'?newCatch():go(d.nav);else if(d.go)go(d.go);else if('new'in d)newCatch();else if(d.edit){edit={...data.catches.find(c=>c.id===Number(d.edit))};go('Log')}else if('filter'in d){filter=filter==='All'?'Personal only':'All';render()}else if('create'in d){let name=prompt('Social name?');if(!name)return;data.socials.push({id:Date.now(),name,venue:prompt('Venue?')||name,date:new Date().toISOString().slice(0,10)});save()}else if(d.social)newCatch(d.social);else if(d.metric){leaderMetric=d.metric;render()}else if('weatherSearch'in d)searchWeather($('#weather-search')?.value||'');else if('weatherHere'in d){if(!navigator.geolocation){weatherError='Location not supported on this device';render();return}weatherBusy=true;render();navigator.geolocation.getCurrentPosition(p=>loadWeather(p.coords.latitude,p.coords.longitude,'My current location'),()=>{weatherBusy=false;weatherError='Location permission denied or unavailable. Search for a nearby town instead.';render()},{timeout:12000})}else if('weatherRefresh'in d)loadWeather(weatherLat,weatherLon,weatherPlace);else if(d.expand){expanded=expanded===Number(d.expand)?null:Number(d.expand);render()}else if('save'in d){if(edit.lb===''||Number(edit.lb)<0||Number(edit.oz)<0||Number(edit.oz)>15)return alert('Enter a valid weight (ounces 0–15).');let c={...edit,id:edit.id||Date.now(),lb:Number(edit.lb),oz:Number(edit.oz)};data.catches=edit.id?data.catches.map(x=>x.id===edit.id?c:x):[c,...data.catches];edit=null;page='Diary';save()}else if('delete'in d){if(confirm('Delete this catch?')){data.catches=data.catches.filter(x=>x.id!==edit.id);edit=null;page='Diary';save()}}else if('export'in d){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fresh-fishing-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='weather-search')searchWeather(ev.target.value);});
document.addEventListener('input',ev=>{if(ev.target.dataset.field&&edit)edit[ev.target.dataset.field]=ev.target.value;if(ev.target.id==='profile-name'){data.name=ev.target.value;try{localStorage.setItem('fft-proto',JSON.stringify(data))}catch{}}});
document.addEventListener('change',ev=>{if(ev.target.dataset.field&&edit)edit[ev.target.dataset.field]=ev.target.value;if(ev.target.id==='photo-input'){const file=ev.target.files[0];if(!file)return;if(file.size>1200000)return alert('Choose a photo under 1.2MB for this prototype.');let r=new FileReader();r.onload=()=>{edit.photo=r.result;render()};r.readAsDataURL(file)}});
render();
try{let loc=JSON.parse(localStorage.getItem('fft-weather-location')||'null');if(loc)loadWeather(loc.lat,loc.lon,loc.label)}catch{}
</script></body></html>
